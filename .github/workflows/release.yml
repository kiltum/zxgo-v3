# Release: a push to a `release-*` branch builds the macOS binary, packages it as a
# .dmg and refreshes a GitHub pre-release for that version.
#
# THE BRANCH IS THE TRIGGER, NOT A TAG. `release-0.1.0` is version 0.1.0: the pipeline
# creates the tag `v0.1.0` itself, at the commit it built, and attaches the packages
# to it. Pushing to the same branch again replaces the assets rather than failing, so
# the branch is the source of truth and every commit on it republishes.
#
# Every release made this way is marked **pre-release**, because a branch is a
# candidate and not a decision. Making one final is one click on the release page (or
# `gh release edit v1.0.0 --prerelease=false`), and that is the only step here that is
# deliberately left to a person.
#
# The build is the same one ci.yml makes - `go build` against Homebrew's SDL3, linked
# dynamically - so what is published is what CI would have built for that commit.
# macOS only, for now, and so is the packaging. Linux, Windows and a .deb come next,
# each on its own runner with its own SDL3; that is a step in this file per target.
# `build.sh` builds all three *statically* (self-contained, SDL3 inside) and is not
# used here - it is the local/internal path, and one to come back to if the releases
# should ever carry their libraries again.
#
# BUILD.md, "CI and releases", has the whole picture.
name: Release

on:
  push:
    branches: ['release-*']

# Two pushes to the same release branch must not publish over each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'

jobs:
  release:
    name: build, package and publish
    runs-on: macos-latest
    env:
      # The vendored Dear ImGui makes internal/ui/imgui a C++ package, so cgo links
      # with the C++ driver: both compilers have to be set and agree about the
      # target (BUILD.md, "Toolchains").
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      # The version is the branch name with the prefix off: release-0.1.0 is 0.1.0.
      # The guard is here because the pattern in `on:` is a filter, not a promise -
      # and a release named after a branch that is not a version is worse than a run
      # that stops.
      - name: Version from the branch
        run: |
          set -eu
          branch="$GITHUB_REF_NAME"
          case "$branch" in
            release-?*) ;;
            *) echo "not a release branch (release-XXXX): $branch"; exit 1 ;;
          esac
          version="${branch#release-}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v${version}" >> "$GITHUB_ENV"
          echo "version $version, tag v${version}"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: SDL3
        run: brew install sdl3 pkg-config

      # The same command ci.yml runs, so the release is what CI built for this
      # commit - plus a name that says which platform it came from.
      - name: Build
        run: go build -trimpath -o zxgo-macos ./cmd/zxgo

      # A disk image, which is how a Mac gets a program: mount it and drag `zxgo`
      # where you want it. The image holds one binary called plain `zxgo` - not the
      # `zxgo-macos` that build.sh names its output - so what is inside it does not
      # carry the platform the way the file it came from does.
      #
      # UDZO is the compressed read-only format, and HFS+ is asked for explicitly so
      # the image mounts on macOS older than the runner's.
      - name: Package
        run: |
          set -eu
          name="zxgo-${VERSION}-macos-arm64"
          mkdir -p "dist/$name"
          install -m 0755 zxgo-macos "dist/$name/zxgo"
          hdiutil create -quiet -ov -fs HFS+ -format UDZO \
            -volname "zxgo ${VERSION}" \
            -srcfolder "dist/$name" "dist/$name.dmg"
          rm -rf "dist/$name"
          ls -l dist

      # Only the globs that match something: with `set -e` an unmatched glob is a
      # failure, not an empty list - and a release that cannot checksum itself is
      # worse than one with fewer files in it. `*.zip` and `*.deb` come back with
      # the Windows and Debian targets.
      - name: Checksums
        run: |
          set -eu
          (cd dist && shasum -a 256 -- *.dmg > SHA256SUMS)
          cat dist/SHA256SUMS

      # Always, so a run that fails after this point has still left something to
      # inspect.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ github.sha }}
          if-no-files-found: error
          path: dist/*

      # Create the first time, refresh after that: a push to a release branch that
      # already has a release replaces its assets rather than dying on "already
      # exists", which is what makes "every commit republishes" work.
      - name: Publish or refresh the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating $TAG"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --title "$TAG"
          else
            echo "creating $TAG at $GITHUB_SHA"
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" --title "$TAG" --prerelease --generate-notes
          fi
          gh release view "$TAG" --json tagName,isPrerelease,url \
            --template '{{.tagName}} (prerelease={{.isPrerelease}}) {{.url}}{{"\n"}}'
